name: Coleta Balanço

# Roda a coleta a cada 30 min e publica o data.json atualizado.
# Manual: aba Actions → "Coleta Balanço" → Run workflow.

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: balanco-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Restaurar cache SQLite
        uses: actions/cache/restore@v4
        with:
          path: state/cache.db
          # chave única por rodada: actions/cache é imutável por chave;
          # restore-keys recupera o cache mais recente e o save cria um novo.
          key: balanco-cache-${{ github.run_id }}
          restore-keys: balanco-cache-

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Rodar coleta
        run: python app.py --body --body-cap 40

      - name: Salvar cache SQLite
        uses: actions/cache/save@v4
        if: always()
        with:
          path: state/cache.db
          key: balanco-cache-${{ github.run_id }}

      - name: Commit dos dados
        run: |
          git config user.name "balanco-bot"
          git config user.email "balanco-bot@local"
          git add docs/data.json docs/feed.xml docs/arquivo state/health.json state/factcheck_ledger.json
          git diff --cached --quiet || git commit -m "atualização automática $(date -u +%FT%TZ)"
          # se um commit manual entrou durante a rodada, rebase antes do push
          git pull --rebase -X ours origin main
          git push
