name: Coleta Balanço

# Roda a coleta a cada 30 min. Publica o docs/ via GitHub Pages (artefato),
# sem versionar data.json a cada rodada. Se o repositório ainda estiver em
# "Deploy from branch", faz fallback para o commit antigo e mantém o site.
# Manual: aba Actions → "Coleta Balanço" → Run workflow.

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: balanco-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Cache do modelo de embeddings
        uses: actions/cache@v4
        with:
          path: state/models
          key: balanco-embed-minilm-l12-v2

      - name: Restaurar cache SQLite
        uses: actions/cache/restore@v4
        with:
          path: |
            state/cache.db
            state/factcheck_ledger.json
            state/pautas_snapshot.json
            state/opiniao.json
            state/metrics
            state/week_digest.json.gz
            state/pautas_metrics.json
          # chave única por rodada: actions/cache é imutável por chave;
          # restore-keys recupera o cache mais recente e o save cria um novo.
          key: balanco-cache-${{ github.run_id }}
          restore-keys: balanco-cache-

      - name: Semear cache se o cache do Actions falhar
        run: |
          if [ ! -s state/cache.db ] && [ -f state/seed.db.gz ]; then
            gunzip -c state/seed.db.gz > state/cache.db
            echo "cache semeado de state/seed.db.gz"
          fi

      - name: Instalar dependências
        run: pip install -r requirements.txt -r requirements-embed.txt

      - name: Rodar coleta
        env:
          FASTEMBED_CACHE_PATH: state/models
        run: python app.py --body --body-cap 120 --embed

      - name: Salvar cache SQLite
        uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            state/cache.db
            state/factcheck_ledger.json
            state/pautas_snapshot.json
            state/opiniao.json
            state/metrics
            state/week_digest.json.gz
            state/pautas_metrics.json
          key: balanco-cache-${{ github.run_id }}

      - name: Configurar Pages
        id: pages
        uses: actions/configure-pages@v5
        continue-on-error: true
        with:
          enablement: true

      - name: Empacotar docs para Pages
        id: upload
        uses: actions/upload-pages-artifact@v3
        continue-on-error: true
        with:
          path: docs

      - name: Publicar no GitHub Pages
        id: deployment
        if: steps.upload.outcome == 'success'
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Fallback — commit se o Pages não aceitar o artefato
        if: steps.deployment.outcome != 'success'
        run: |
          git config user.name "balanco-bot"
          git config user.email "balanco-bot@local"
          git add docs/data.json docs/feed.xml docs/arquivo state/health.json state/factcheck_ledger.json state/pautas_snapshot.json state/opiniao.json state/metrics state/week_digest.json.gz state/pautas_metrics.json
          git diff --cached --quiet || git commit -m "atualização automática (fallback) $(date -u +%FT%TZ)"
          git checkout -- docs/data.json docs/feed.xml 2>/dev/null || true
          git pull --rebase -X ours origin main
          git push

      # O site já foi publicado acima; este passo só arquiva o dia no git.
      # Se ele falhar, mantém o run verde e registra o aviso — o arquivo é
      # secundário e pode ser recuperado na próxima rodada.
      - name: Commit diário do arquivo e do estado
        continue-on-error: true
        run: |
          git config user.name "balanco-bot"
          git config user.email "balanco-bot@local"
          DAY=$(date -u +%F)
          MARK=state/.last_commit_day
          if [ "$(cat "$MARK" 2>/dev/null)" = "$DAY" ] && git diff --quiet -- docs/arquivo; then
            echo "arquivo/estado já registrados hoje"
            exit 0
          fi
          # data/feed saem pelo artefato do Pages; voltam ao estado do git
          git restore docs/data.json 2>/dev/null || true
          git restore docs/feed.xml 2>/dev/null || true
          git add docs/arquivo state/health.json state/factcheck_ledger.json state/pautas_snapshot.json state/opiniao.json state/metrics state/week_digest.json.gz state/pautas_metrics.json 2>/dev/null || true
          echo "$DAY" > "$MARK"
          git add "$MARK" docs/arquivo state/health.json state/factcheck_ledger.json state/pautas_snapshot.json state/opiniao.json state/metrics state/week_digest.json.gz state/pautas_metrics.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "sem mudança para registrar"
            exit 0
          fi
          git commit -m "arquivo diário $DAY"
          # sobras do working tree vão para o autostash; se o remoto andou,
          # rebase e nova tentativa em vez de derrubar o run
          for i in 1 2 3; do
            if git -c rebase.autoStash=true pull --rebase -X ours origin main \
               && git push origin HEAD:main; then
              echo "estado publicado"
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "tentativa $i falhou; repetindo em $((i * 10))s"
            sleep $((i * 10))
          done
          echo "::warning::não foi possível arquivar o estado diário; o site já estava publicado"
          exit 1
