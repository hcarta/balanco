name: Diagnóstico das capas

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements.txt
      - name: Testar as 6 capas no runner
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, ".")
          import requests
          from bs4 import BeautifulSoup
          import app

          print("python", sys.version.split()[0])
          for key, cfg in app.FRONT_PAGES.items():
              print(f"\n=== {key} ===")
              try:
                  r = requests.get(
                      cfg["url"], timeout=25,
                      headers={"User-Agent": "Balanco/0.2 (+news aggregator; local)"})
                  body = r.content
                  text = body.decode("utf-8", errors="replace")
                  soup = BeautifulSoup(text, "lxml")
                  raw = soup.select(cfg["sel"])
                  items = app._front_items(text, cfg)
                  print(f"status={r.status_code} bytes={len(body)} "
                        f"selector_hits={len(raw)} items={len(items)}")
                  print("content-type:", r.headers.get("content-type"))
                  for it in items[:3]:
                      print("   -", it["title"][:70])
                      print("     ", it["link"][:90])
              except Exception as ex:
                  print(f"ERRO {type(ex).__name__}: {ex}")

          print("\n=== fetch_front_page ===")
          for key in app.FRONT_PAGES:
              print(key, len(app.fetch_front_page(key)))
          PY
