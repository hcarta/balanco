# key: chave estável usada em ?pauta=<key>
# label: rótulo exibido
# match: termos que identificam a pauta nas manchetes (normalizados:
#        sem acento, singular; expressões multi-palavra valem como sequência)
# aliases: chaves antigas que devem continuar funcionando
